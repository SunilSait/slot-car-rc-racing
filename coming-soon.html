<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This page is coming soon. Subscribe for updates on new track features, leagues, and Pro Shop drops from Apex Raceway.">
    <title>Coming Soon | Apex Raceway — Slot Car & RC Racing</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto;width:100%;">
    <a href="index.html" class="nav-logo" aria-label="Apex Raceway Home" style="display:flex;align-items:center;gap:0.75rem;text-decoration:none;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="38" height="38" style="flex-shrink:0;">
            <circle cx="32" cy="32" r="32" fill="#0D1B2A"/>
            <circle cx="32" cy="32" r="26" stroke="#00B4D8" stroke-width="2.5" fill="none" stroke-dasharray="6 3" opacity="0.6"/>
            <rect x="18" y="28" width="28" height="10" rx="3" fill="#00B4D8"/>
            <rect x="24" y="24" width="12" height="8" rx="2" fill="#1a3a5c"/>
            <circle cx="22" cy="38" r="4" fill="#080f1a" stroke="#00B4D8" stroke-width="2"/>
            <circle cx="42" cy="38" r="4" fill="#080f1a" stroke="#00B4D8" stroke-width="2"/>
            <line x1="6" y1="30" x2="14" y2="30" stroke="#00B4D8" stroke-width="2" stroke-linecap="round"/>
            <line x1="6" y1="34" x2="12" y2="34" stroke="#00B4D8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <div class="nav-logo-text">
            <span class="brand-name" style="font-family:var(--font-heading);font-weight:600;font-size:1.125rem;color:var(--text-heading);text-transform:uppercase;letter-spacing:0.04em;">Apex Raceway</span>
            <span class="brand-tagline" style="font-size:0.5625rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;">Slot Car & RC Racing</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <!-- Decorative glow -->
        <div style="position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:min(450px, 90vw);height:min(450px, 90vw);background:radial-gradient(circle,rgba(0,180,216,0.12),transparent 65%);border-radius:50%;pointer-events:none;"></div>

        <div style="position:relative;z-index:2;">
            <div class="section-badge" style="justify-content:center;margin-bottom:1rem;display:inline-flex;">
                <i class="fas fa-wrench"></i> Under Construction
            </div>
            <h1 class="coming-title">Something Epic is Coming</h1>
            <p class="coming-desc">
                We're crafting something thrilling for the racing community. This feature is currently in the pits getting tuned up. Subscribe to get notified at launch!
            </p>

            <!-- Countdown -->
            <div class="countdown-grid" id="countdown">
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-days">24</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-hours">12</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-mins">45</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-value" id="cd-secs">30</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>

            <!-- Subscribe Form -->
            <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you when this launches.'); this.reset();">
                <input type="email" placeholder="your@email.com" required aria-label="Email address">
                <button type="submit" class="btn btn-primary" style="white-space:nowrap;"><i class="fas fa-bell"></i> Notify Me</button>
            </form>

            <!-- Social Links -->
            <div class="coming-socials">
                <a href="#" class="coming-social-link" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="coming-social-link" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" class="coming-social-link" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="#" class="coming-social-link" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
            </div>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();

        // 30-Day live countdown timer
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
            document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    });
</script>
</body>
</html>
