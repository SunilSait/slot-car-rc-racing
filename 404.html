<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="404 — Page not found. The page you're looking for doesn't exist or has taken a detour off the track.">
    <title>404 — Page Not Found | Apex Raceway — Slot Car & RC Racing</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .wheel-spin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            opacity: 0.14;
            animation: spin 14s linear infinite;
        }
        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body class="fullscreen-page">

<!-- Top Bar -->
<div style="display:flex;align-items:center;justify-content:space-between;padding:1.25rem 1.5rem;max-width:1200px;margin:0 auto;width:100%;">
    <a href="index.html" class="nav-logo" aria-label="Apex Raceway Home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" style="width:40px;height:40px;display:block;flex-shrink:0;">
            <circle cx="32" cy="32" r="32" fill="#0D1B2A"/>
            <circle cx="32" cy="32" r="26" stroke="#00B4D8" stroke-width="2.5" fill="none" stroke-dasharray="6 3" opacity="0.6"/>
            <rect x="18" y="28" width="28" height="10" rx="3" fill="#00B4D8"/>
            <rect x="24" y="24" width="12" height="8" rx="2" fill="#1a3a5c"/>
            <circle cx="22" cy="38" r="4" fill="#080f1a" stroke="#00B4D8" stroke-width="2"/>
            <circle cx="42" cy="38" r="4" fill="#080f1a" stroke="#00B4D8" stroke-width="2"/>
            <line x1="6" y1="30" x2="14" y2="30" stroke="#00B4D8" stroke-width="2" stroke-linecap="round"/>
            <line x1="6" y1="34" x2="12" y2="34" stroke="#00B4D8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <div class="nav-logo-text">
            <span class="brand-name">Apex Raceway</span>
            <span class="brand-tagline">Slot Car & RC Racing</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <div class="error-illustration">
            <!-- Spinning gear/wheel background -->
            <svg class="wheel-spin" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="60" cy="60" r="54" stroke="#00B4D8" stroke-width="4" stroke-dasharray="12 6"/>
                <circle cx="60" cy="60" r="36" stroke="#00B4D8" stroke-width="3"/>
                <circle cx="60" cy="60" r="14" fill="#00B4D8"/>
                <line x1="60" y1="6" x2="60" y2="114" stroke="#00B4D8" stroke-width="3"/>
                <line x1="6" y1="60" x2="114" y2="60" stroke="#00B4D8" stroke-width="3"/>
                <line x1="22" y1="22" x2="98" y2="98" stroke="#00B4D8" stroke-width="2.5"/>
                <line x1="22" y1="98" x2="98" y2="22" stroke="#00B4D8" stroke-width="2.5"/>
            </svg>
            <div class="error-code">404</div>
        </div>
        <div class="error-subtitle">Off the Track!</div>
        <p class="error-desc">Looks like this racer went off circuit! The page you're looking for has taken a pit stop, been moved, or never existed.</p>
        <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;">
            <a href="index.html" class="btn btn-primary btn-lg"><i class="fas fa-house"></i> Back to Home</a>
            <a href="book-track.html" class="btn btn-outline btn-lg"><i class="fas fa-calendar-check"></i> Book Track</a>
            <a href="contact.html" class="btn btn-outline btn-lg"><i class="fas fa-headset"></i> Contact Support</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();
    });
</script>
</body>
</html>
