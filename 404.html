<style>
body { margin: 0; }
.error-wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; background:var(--bg-body); position:relative; overflow:hidden; }

.error-controls { position:absolute; top:1.5rem; right:1.5rem; display:flex; gap:.5rem; }

</head>
<body>
<div class="error-wrap">
  <div class="error-controls">
    <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction"><span class="dir-label" style="font-size:.6rem;font-weight:700;">LTR</span></button>

  </div>

    <a href="index.html" style="display:inline-flex;align-items:center;gap:.625rem;text-decoration:none;margin-bottom:3rem;justify-content:center;">

        <circle cx="42" cy="38" r="4" fill="var(--bg-body,#fff)" stroke="#FF5F1F" stroke-width="2"/>
      </svg>
      <div style="text-align:left;">
        <div style="font-family:var(--font-heading);font-size:1rem;font-weight:800;color:var(--text-heading);text-transform:uppercase;letter-spacing:.05em;">Apex Raceway</div>
        <div style="font-size:.5625rem;color:var(--text-muted);text-transform:uppercase;">Slot Car & RC Racing</div>

    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
      <a href="index.html" class="btn btn-primary"><i class="fas fa-house"></i> Back to Home</a>
      <a href="book-track.html" class="btn btn-outline"><i class="fas fa-calendar-check"></i> Book Track</a>
    </div>
    <div style="margin-top:3rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;">

      <a href="contact.html" style="font-size:.875rem;color:var(--text-muted);text-decoration:none;transition:color 150ms;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'"><i class="fas fa-envelope" style="margin-right:.375rem;color:var(--primary);"></i>Contact</a>
