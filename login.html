<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Apex Raceway account to manage bookings, track lap times, view standings, and register for race events.">
    <title>Sign In | Apex Raceway — Slot Car & RC Racing</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<!-- Top Bar -->
<div class="auth-topbar">
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<!-- Card -->
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;">
    <div class="auth-card">
        <!-- Decorative ambient glow -->
        <div style="position:absolute;top:-60px;right:-60px;width:140px;height:140px;background:rgba(255,95,31,0.12);border-radius:50%;filter:blur(30px);pointer-events:none;"></div>

        <!-- Logo -->
        <a href="index.html" class="auth-logo" aria-label="Apex Raceway Home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="44" height="44" style="flex-shrink:0;">
                <circle cx="32" cy="32" r="32" fill="#0D1B2A"/>
                <circle cx="32" cy="32" r="26" stroke="#FF5F1F" stroke-width="2.5" fill="none" stroke-dasharray="6 3" opacity="0.6"/>
                <rect x="18" y="28" width="28" height="10" rx="3" fill="#FF5F1F"/>
                <rect x="24" y="24" width="12" height="8" rx="2" fill="#1a3a5c"/>
                <circle cx="22" cy="38" r="4" fill="#080f1a" stroke="#FF5F1F" stroke-width="2"/>
                <circle cx="42" cy="38" r="4" fill="#080f1a" stroke="#FF5F1F" stroke-width="2"/>
                <line x1="6" y1="30" x2="14" y2="30" stroke="#FF5F1F" stroke-width="2" stroke-linecap="round"/>
                <line x1="6" y1="34" x2="12" y2="34" stroke="#FF5F1F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
            </svg>
            <div class="auth-logo-text">
                <span class="brand-top">Apex Raceway</span>
                <span class="brand-bottom">Slot Car & RC Racing</span>
            </div>
        </a>

        <!-- Header -->
        <div style="text-align:center;margin-bottom:1.75rem;">
            <h1 style="font-size:1.5rem;font-weight:600;margin-bottom:0.375rem;color:var(--text-heading);">Welcome Back</h1>
            <p style="font-size:0.875rem;color:var(--text-muted);font-weight:400;">Sign in to your racer account</p>
        </div>

        <!-- Social Login -->
        <div class="social-login-grid">
            <button class="social-btn" title="Sign in with Google" onclick="alert('Google sign-in')">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            </button>
            <button class="social-btn" title="Sign in with Apple" onclick="alert('Apple sign-in')">
                <i class="fab fa-apple" style="font-size:1.25rem;"></i>
            </button>
            <button class="social-btn" title="Sign in with Facebook" onclick="alert('Facebook sign-in')">
                <i class="fab fa-facebook-f" style="font-size:1.125rem;color:#1877F2;"></i>
            </button>
        </div>

        <!-- Divider -->
        <div class="divider">or sign in with email</div>

        <!-- Form -->
        <form onsubmit="event.preventDefault(); alert('Login successful!'); window.location.href='dashboard.html';" id="login-form">
            <div class="form-group" style="margin-bottom:1.125rem;">
                <label class="form-label" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-input" placeholder="your@email.com" required>
            </div>
            <div class="form-group" style="margin-bottom:1.125rem;">
                <label class="form-label" for="login-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', this.querySelector('i'))" aria-label="Toggle password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.5rem;">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Remember Me</label>
                </div>
                <a href="#" class="link-primary" style="font-size:0.875rem;">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-full btn-lg" style="width:100%;"><i class="fas fa-right-to-bracket"></i> Sign In</button>
        </form>

        <!-- Footer link -->
        <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;color:var(--text-muted);font-weight:400;">
            Don't have an account? <a href="signup.html" class="link-primary">Sign Up</a>
        </p>
    </div>
</main>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initAuthPage();
    });
</script>
</body>
</html>
